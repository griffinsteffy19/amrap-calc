name: Roadmap Sync

on:
  issues:
    types: [opened, closed, labeled, unlabeled]
  pull_request:
    types: [opened, closed, merged]
  milestone:
    types: [opened, closed, edited]

jobs:
  update-roadmap-status:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'roadmap') || contains(github.event.pull_request.labels.*.name, 'roadmap')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: develop
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update roadmap progress
      uses: actions/github-script@v7
      with:
        script: |
          // Get milestone information
          const milestones = await github.rest.issues.listMilestones({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'all'
          });
          
          console.log('Milestones found:', milestones.data.length);
          
          // Create progress summary
          let progressSummary = '## Milestone Progress\n\n';
          
          for (const milestone of milestones.data) {
            const progress = milestone.closed_issues / (milestone.open_issues + milestone.closed_issues) * 100;
            const progressBar = '█'.repeat(Math.floor(progress / 5)) + '░'.repeat(20 - Math.floor(progress / 5));
            
            progressSummary += `### ${milestone.title}\n`;
            progressSummary += `**Progress**: ${progress.toFixed(1)}% (${milestone.closed_issues}/${milestone.open_issues + milestone.closed_issues})\n`;
            progressSummary += `\`${progressBar}\`\n\n`;
            
            if (milestone.description) {
              progressSummary += `${milestone.description}\n\n`;
            }
          }
          
          console.log('Generated progress summary');
          core.setOutput('progress_summary', progressSummary);

  add-to-project-board:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' && github.event.issue
    
    steps:
    - name: Add issue to project board
      uses: actions/add-to-project@v0.5.0
      with:
        project-url: https://github.com/users/griffinsteffy19/projects/2
        github-token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Route issues to appropriate columns
      uses: actions/github-script@v7
      with:
        script: |
          const issue = github.event.issue;
          
          // Check issue type and route accordingly
          const labels = issue.labels.map(label => label.name);
          const isFromApp = issue.body && issue.body.includes('Reported from Streamlit App');
          
          if (labels.includes('bug')) {
            console.log('Bug report - should go to Backlog (manual move required)');
            // Bugs go directly to Backlog for immediate triage and fixing
          } else if (labels.includes('feature')) {
            console.log('Feature request - should go to Ideas (manual move required)');  
            // Feature requests go to Ideas for evaluation and discussion
          } else {
            console.log('Other issue type - will stay in default column');
          }
          
          // Note: Automatic column movement requires GraphQL API and column IDs
          // For now, this serves as documentation of the intended workflow