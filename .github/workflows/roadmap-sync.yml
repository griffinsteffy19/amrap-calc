name: Roadmap Sync

on:
  issues:
    types: [opened, closed, labeled, unlabeled]
  pull_request:
    types: [opened, closed, merged]
  milestone:
    types: [opened, closed, edited]

jobs:
  update-roadmap-status:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'roadmap') || contains(github.event.pull_request.labels.*.name, 'roadmap')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: develop
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update roadmap progress
      uses: actions/github-script@v7
      with:
        script: |
          // Get milestone information
          const milestones = await github.rest.issues.listMilestones({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'all'
          });
          
          console.log('Milestones found:', milestones.data.length);
          
          // Create progress summary
          let progressSummary = '## Milestone Progress\n\n';
          
          for (const milestone of milestones.data) {
            const progress = milestone.closed_issues / (milestone.open_issues + milestone.closed_issues) * 100;
            const progressBar = '█'.repeat(Math.floor(progress / 5)) + '░'.repeat(20 - Math.floor(progress / 5));
            
            progressSummary += `### ${milestone.title}\n`;
            progressSummary += `**Progress**: ${progress.toFixed(1)}% (${milestone.closed_issues}/${milestone.open_issues + milestone.closed_issues})\n`;
            progressSummary += `\`${progressBar}\`\n\n`;
            
            if (milestone.description) {
              progressSummary += `${milestone.description}\n\n`;
            }
          }
          
          console.log('Generated progress summary');
          core.setOutput('progress_summary', progressSummary);

  add-to-project:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' && github.event.issue
    
    steps:
    - name: Add issue to project using GraphQL API
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const issueId = context.payload.issue.node_id;
          const projectNumber = 2;
          
          console.log(`Adding issue ${context.payload.issue.number} to project ${projectNumber}`);
          
          try {
            // Get the project ID using GraphQL
            const projectQuery = `
              query getProject($login: String!, $number: Int!) {
                user(login: $login) {
                  projectV2(number: $number) {
                    id
                  }
                }
              }`;
            
            const projectResponse = await github.graphql(projectQuery, {
              login: 'griffinsteffy19',
              number: projectNumber
            });
            
            const projectId = projectResponse.user.projectV2.id;
            console.log(`Found project ID: ${projectId}`);
            
            // Add the issue to the project
            const addMutation = `
              mutation addToProject($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemByContentId(input: {
                  projectId: $projectId,
                  contentId: $contentId
                }) {
                  item {
                    id
                  }
                }
              }`;
            
            const addResponse = await github.graphql(addMutation, {
              projectId: projectId,
              contentId: issueId
            });
            
            console.log(`✅ Successfully added issue to project!`);
            console.log(`Item ID: ${addResponse.addProjectV2ItemByContentId.item.id}`);
            
          } catch (error) {
            console.log(`❌ Error adding issue to project: ${error}`);
            console.log(`Issue ID: ${issueId}`);
            console.log(`Project Number: ${projectNumber}`);
            
            // Don't fail the workflow, just log the error
            core.warning(`Failed to add issue to project: ${error.message}`);
          }
        
    - name: Log issue routing info
      uses: actions/github-script@v7
      with:
        script: |
          const issue = github.event.issue;
          const labels = issue.labels.map(label => label.name);
          const isFromApp = issue.body && (
            issue.body.includes('Reported from Streamlit App') || 
            issue.body.includes('Requested from Streamlit App')
          );
          
          console.log(`Issue #${issue.number}: ${issue.title}`);
          console.log(`Labels: ${labels.join(', ')}`);
          console.log(`From Streamlit App: ${isFromApp}`);
          
          if (labels.includes('bug')) {
            console.log('→ Bug report: Added to project (should be moved to Backlog)');
          } else if (labels.includes('feature')) {
            console.log('→ Feature request: Added to project (should be moved to Ideas)');  
          } else if (labels.includes('roadmap')) {
            console.log('→ Roadmap task: Added to project (should be moved to Backlog)');
          } else {
            console.log('→ Other issue: Added to project (default column)');
          }